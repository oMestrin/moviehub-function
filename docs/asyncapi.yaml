asyncapi: 3.0.0
info:
  title: MovieHub — Eventos de Avaliação
  version: 1.0.0
  description: |
    Eventos publicados pelo microsserviço de avaliações (MS2) sempre que uma
    avaliação é registrada, alterada ou removida. As mensagens seguem o
    formato CloudEvents 1.0 (modo estruturado, JSON) e são gravadas em Base64
    na fila `avaliacoes-eventos` do Azure Storage.

    A Azure Function `syncMembersRating` consome a fila, consulta
    `GET /movie-stats/{movieId}` no MS2 e grava a média em
    `PATCH /movies/{movieId}/members-rating` no MS1. Como a média é
    recalculada a partir da fonte, o processamento é idempotente.
    Após 5 falhas a mensagem vai para `avaliacoes-eventos-poison`.
servers:
  azure:
    host: "{storageAccount}.queue.core.windows.net"
    protocol: https
    description: Azure Storage Queue
    variables:
      storageAccount:
        default: moviehubstorage
defaultContentType: application/json
channels:
  avaliacoesEventos:
    address: avaliacoes-eventos
    description: Fila de eventos de avaliação.
    messages:
      avaliacaoRegistrada:
        $ref: "#/components/messages/avaliacaoRegistrada"
      avaliacaoAtualizada:
        $ref: "#/components/messages/avaliacaoAtualizada"
      avaliacaoRemovida:
        $ref: "#/components/messages/avaliacaoRemovida"
operations:
  publicarEventoDeAvaliacao:
    action: send
    title: MS2 publica evento de avaliação
    summary: Enviado pelo moviehub-ms-avaliacoes após POST, PUT ou DELETE em /reviews.
    channel:
      $ref: "#/channels/avaliacoesEventos"
    messages:
      - $ref: "#/channels/avaliacoesEventos/messages/avaliacaoRegistrada"
      - $ref: "#/channels/avaliacoesEventos/messages/avaliacaoAtualizada"
      - $ref: "#/channels/avaliacoesEventos/messages/avaliacaoRemovida"
  sincronizarNotaDosMembros:
    action: receive
    title: Azure Function recalcula a nota dos membros
    summary: Gatilho de fila syncMembersRating (moviehub-function).
    channel:
      $ref: "#/channels/avaliacoesEventos"
    messages:
      - $ref: "#/channels/avaliacoesEventos/messages/avaliacaoRegistrada"
      - $ref: "#/channels/avaliacoesEventos/messages/avaliacaoAtualizada"
      - $ref: "#/channels/avaliacoesEventos/messages/avaliacaoRemovida"
components:
  messages:
    avaliacaoRegistrada:
      name: moviehub.avaliacao.registrada
      title: Avaliação registrada
      payload:
        $ref: "#/components/schemas/ReviewCloudEvent"
      examples:
        - name: registrada
          payload:
            specversion: "1.0"
            id: 6f1d2c1e-8f43-4c3a-9b7e-1c2d3e4f5a6b
            source: /moviehub/ms-avaliacoes
            type: moviehub.avaliacao.registrada
            time: "2026-11-08T12:00:00.000Z"
            subject: movies/4f3c2a1e-0001-4b8e-9f00-000000000001
            datacontenttype: application/json
            data:
              reviewId: 9a0c7e52-0001-4d1a-8c00-000000000001
              movieId: 4f3c2a1e-0001-4b8e-9f00-000000000001
              rating: 9
    avaliacaoAtualizada:
      name: moviehub.avaliacao.atualizada
      title: Avaliação alterada
      payload:
        $ref: "#/components/schemas/ReviewCloudEvent"
    avaliacaoRemovida:
      name: moviehub.avaliacao.removida
      title: Avaliação removida
      payload:
        $ref: "#/components/schemas/ReviewCloudEvent"
  schemas:
    ReviewCloudEvent:
      type: object
      required: [specversion, id, source, type, time, data]
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
          description: Id único do evento.
        source:
          type: string
          const: /moviehub/ms-avaliacoes
        type:
          type: string
          enum:
            - moviehub.avaliacao.registrada
            - moviehub.avaliacao.atualizada
            - moviehub.avaliacao.removida
        time:
          type: string
          format: date-time
        subject:
          type: string
          description: movies/{movieId}
        datacontenttype:
          type: string
          const: application/json
        data:
          type: object
          required: [reviewId, movieId, rating]
          properties:
            reviewId:
              type: string
            movieId:
              type: string
            rating:
              type: integer
              minimum: 0
              maximum: 10
